<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>DeepSeek Harness</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #0f1115; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }

    #titlebar {
      height: 38px;
      position: relative;
      display: flex;
      align-items: center;
      background: #ececec;
      color: #1f2328;
      border-bottom: 1px solid #d7d7dc;
      -webkit-app-region: drag;
      user-select: none;
    }
    #titlebar .title {
      position: absolute;
      left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 13px;
      color: #3a3a3c;
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      padding: 0 90px;
    }
    #titlebar .title .whale {
      flex: none;
      width: 22px;
      height: 16px;
      display: block;
    }
    #titlebar .traffic-lights {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 14px;
      height: 100%;
      -webkit-app-region: no-drag;
      z-index: 1;
    }
    #titlebar .light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: none;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex: none;
      color: rgba(0, 0, 0, 0.55);
    }
    #titlebar .light.close { background: #ff5f57; }
    #titlebar .light.min   { background: #febc2e; }
    #titlebar .light.max   { background: #28c840; }
    #titlebar .light svg {
      display: block;
      opacity: 0;
      transition: opacity .1s ease;
    }
    #titlebar .traffic-lights:hover .light svg { opacity: 1; }

    #app { height: calc(100% - 38px); }
    iframe { width: 100%; height: 100%; border: none; display: block; background: #0f1115; }
  </style>
</head>
<body>
  <div id="titlebar">
    <div class="traffic-lights">
      <button id="btn-close" class="light close" title="关闭" aria-label="关闭">
        <svg width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M1 1 7 7 M7 1 1 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-min" class="light min" title="最小化" aria-label="最小化">
        <svg width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M1 4 H7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-max" class="light max" title="最大化" aria-label="最大化">
        <svg width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M4 1 V7 M1 4 H7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="title">
      <img class="whale" src="./assets/whale.svg" alt="" />
      <span>DeepSeek Harness</span>
    </div>
  </div>
  <div id="app">
    <iframe id="app-frame" src="http://127.0.0.1:3080" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
  </div>

  <script>
    const ctrl = window.desktopControls || {};
    document.getElementById('btn-min').addEventListener('click', () => ctrl.minimize());
    document.getElementById('btn-max').addEventListener('click', () => ctrl.maximize());
    document.getElementById('btn-close').addEventListener('click', () => ctrl.close());
  </script>
</body>
</html>
